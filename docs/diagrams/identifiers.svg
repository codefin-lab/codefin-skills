<svg viewBox="0 0 944 316" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ids-title ids-desc">
<title id="ids-title">Two identifiers, carrying each other</title>
<desc id="ids-desc">A requirement identifier branches two ways: to the test scenario that proves it and on to the test cases, and to a defect that cites it and on to the regression test that guards it.</desc>
