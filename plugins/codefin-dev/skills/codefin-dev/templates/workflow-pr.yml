# Codefin pull request gate.
#
# Language neutral: it calls the four standard targets, so the same commands a developer runs
# are the ones CI runs. Adjust the toolchain setup step for the project; do not adjust the
# commands, or local and CI will drift.

name: pr

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Replace with this project's toolchain: actions/setup-go, setup-node, setup-python, ...
      - name: Set up toolchain
        run: echo "set up the toolchain for this project"

      - name: Format and lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Build
        run: make build

      # Where this repository publishes something others consume - a schema, an API
      # description, a library's public surface - check it still fits. This is the gate that
      # catches the breakage unit tests are blind to.
      #
      # Skipped, loudly, where the repository defines no such target: a repository with nothing
      # to publish should not fail here, and one that does publish should not pass silently.
      - name: Contract check
        run: |
          if make -n contract-check >/dev/null 2>&1; then
            make contract-check
          else
            echo "No contract-check target. If this repository publishes a schema, an API"
            echo "description or a library's public surface, add one - unit tests cannot see"
            echo "that class of break."
          fi
